<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aquanact</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      border: 0;
      background: #000;
    }

  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

  <script>
    // Emscripten's GLFW calls requestPointerLock() during init without catching the
    // returned Promise; silence those rejections so they don't pollute the console.
    (function() {
      var orig = Element.prototype.requestPointerLock;
      Element.prototype.requestPointerLock = function() {
        var p = orig.apply(this, arguments);
        if (p && typeof p.catch === "function") p.catch(function() {});
        return p;
      };
    })();

    var canvasElement = document.getElementById("canvas");

    function resizeCanvas() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    canvasElement.addEventListener("webglcontextlost", function(event) {
      alert("WebGL context lost. Reload the page to continue.");
      event.preventDefault();
    }, false);

    function unlockAudio() {
      if (window.miniaudio && typeof window.miniaudio.unlock === "function") {
        window.miniaudio.unlock();
      }
      if (Module && typeof Module._Audio_Resume === "function") {
        Module._Audio_Resume();
      }
    }

    ["pointerdown", "click", "touchend", "keydown"].forEach(function(eventName) {
      document.addEventListener(eventName, unlockAudio, true);
      canvasElement.addEventListener(eventName, unlockAudio, true);
    });

    var Module = {
      canvas: canvasElement,
      print: function() {
        console.log.apply(console, arguments);
      },
      printErr: function() {
        console.error.apply(console, arguments);
      },
      setStatus: function() {},
      monitorRunDependencies: function() {}
    };

    window.onerror = function(message) {
      console.error(message);
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
